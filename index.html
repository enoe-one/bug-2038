<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Unix Time Full Visual</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, #0a0a0a, #000000);
        font-family: 'Segoe UI', sans-serif;
        color: white;
    }

    .container {
        text-align: center;
        padding: 30px;
        border-radius: 25px;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(15px);
        box-shadow: 0 0 40px rgba(0,255,200,0.2);
        width: 720px;
    }

    h1 {
        color: #00ffd0;
        margin-bottom: 15px;
    }

    .time {
        font-size: 32px;
        margin-bottom: 5px;
        text-shadow: 0 0 10px #00ffd0;
    }

    .limit {
        color: #ff4d6d;
        margin-bottom: 10px;
    }

    .percent {
        margin-bottom: 10px;
        font-size: 16px;
    }

    .bar-container {
        width: 100%;
        height: 20px;
        background: rgba(255,255,255,0.1);
        border-radius: 20px;
        overflow: hidden;
        margin-bottom: 15px;
    }

    .bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00ffd0, #00aaff);
        box-shadow: 0 0 10px #00ffd0;
        transition: width 0.5s ease;
    }

    .countdown {
        font-size: 18px;
        margin: 10px 0;
        color: #ff4d6d;
        text-shadow: 0 0 10px #ff4d6d;
    }

    canvas {
        margin-top: 10px;
    }
</style>
</head>
<body>

<div class="container">
    <h1>⏱ UNIX TIME COMPLET</h1>

    <div class="time" id="seconds">0</div>

    <div class="limit">Limite 32 bits : 2 147 483 647</div>

    <div class="percent" id="percent">0%</div>

    <div class="bar-container">
        <div class="bar" id="bar"></div>
    </div>

    <div class="countdown" id="countdown">Chargement...</div>

    <canvas id="chart" height="180"></canvas>
</div>

<script>
const MAX = 2147483647;
const END = MAX * 1000;

const ctx = document.getElementById('chart').getContext('2d');

const data = {
    labels: [],
    datasets: [{
        label: 'Progression (%)',
        data: [],
        borderColor: '#00ffd0',
        backgroundColor: 'rgba(0,255,208,0.2)',
        tension: 0.3
    }]
};

const chart = new Chart(ctx, {
    type: 'line',
    data: data,
    options: {
        scales: {
            x: { display: false },
            y: { min: 0, max: 100 }
        }
    }
});

function formatTime(ms) {
    const totalSec = Math.floor(ms / 1000);
    const days = Math.floor(totalSec / 86400);
    const hours = Math.floor((totalSec % 86400) / 3600);
    const minutes = Math.floor((totalSec % 3600) / 60);
    const seconds = totalSec % 60;

    return `${days}j ${hours}h ${minutes}m ${seconds}s`;
}

function update() {
    const nowMs = Date.now();
    const nowSec = Math.floor(nowMs / 1000);
    const percent = (nowSec / MAX) * 100;

    document.getElementById("seconds").textContent = nowSec.toLocaleString();
    document.getElementById("percent").textContent = percent.toFixed(6) + " %";

    // barre
    const bar = document.getElementById("bar");
    bar.style.width = percent + "%";

    if (percent > 80) {
        bar.style.background = "linear-gradient(90deg, #ff4d4d, #ff0000)";
    } else if (percent > 50) {
        bar.style.background = "linear-gradient(90deg, #ffaa00, #ff6600)";
    } else {
        bar.style.background = "linear-gradient(90deg, #00ffd0, #00aaff)";
    }

    // countdown
    const remaining = END - nowMs;
    const countdownEl = document.getElementById("countdown");

    if (remaining > 0) {
        countdownEl.textContent = "⏳ Temps restant avant 2038 : " + formatTime(remaining);
    } else {
        countdownEl.textContent = "💥 LIMITE ATTEINTE !";
    }

    // graph
    const timeLabel = new Date().toLocaleTimeString();
    data.labels.push(timeLabel);
    data.datasets[0].data.push(percent);

    if (data.labels.length > 30) {
        data.labels.shift();
        data.datasets[0].data.shift();
    }

    chart.update();
}

setInterval(update, 1000);
update();
</script>

</body>
</html>
