<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unix Time Optimisé</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    body {
        background-color: #0f0f0f;
        color: #00ffcc;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 20px;
        margin: 0;
    }

    .box {
        border: 2px solid #00ffcc;
        border-radius: 15px;
        padding: 20px;
        margin: 15px auto;
        max-width: 500px;
        background-color: #1a1a1a;
    }

    .big { font-size: 2em; }
    .limit { color: #ff4d4d; }

    .progress {
        margin-top: 15px;
        height: 20px;
        background: #333;
        border-radius: 10px;
        overflow: hidden;
    }

    .bar {
        height: 100%;
        background: #00ffcc;
        width: 0%;
    }

    canvas {
        max-width: 500px;
        margin: 20px auto;
        display: none;
    }

    .controls {
        margin-top: 10px;
    }

    button {
        margin: 5px;
        padding: 6px 10px;
        background: #111;
        color: #00ffcc;
        border: 1px solid #00ffcc;
        border-radius: 8px;
        cursor: pointer;
    }
</style>
</head>
<body>

<h1>⏱ Temps Unix</h1>

<div class="box">
    <div>Secondes depuis 1970 :</div>
    <div id="seconds" class="big">0</div>
</div>

<div class="box">
    <div>Limite 32 bits :</div>
    <div class="big limit">2 147 483 647</div>
</div>

<div class="box">
    <div>Progression :</div>
    <div id="percent">0%</div>
    <div class="progress">
        <div id="bar" class="bar"></div>
    </div>
</div>

<div class="box" id="countdownBox" style="display:none;">
    <div id="countdown">...</div>
</div>

<canvas id="chart"></canvas>

<div class="controls">
    <button onclick="toggleCountdown()">Toggle Countdown</button>
    <button onclick="toggleChart()">Toggle Graph</button>
</div>

<script>
const MAX = 2147483647;
const END = MAX * 1000;

let showChart = false;
let chart;
let data;
let lastChartUpdate = 0;

function initChart() {
    const ctx = document.getElementById('chart').getContext('2d');
    data = {
        labels: [],
        datasets: [{
            data: [],
            borderColor: '#00ffcc',
            tension: 0.3
        }]
    };

    chart = new Chart(ctx, {
        type: 'line',
        data: data,
        options: {
            animation: false,
            responsive: true,
            scales: {
                x: { display: false },
                y: { min: 0, max: 100 }
            }
        }
    });
}

function formatTime(ms) {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s/86400)}j ${Math.floor((s%86400)/3600)}h ${Math.floor((s%3600)/60)}m ${s%60}s`;
}

function update() {
    const now = Date.now();
    const sec = Math.floor(now / 1000);
    const percent = (sec / MAX) * 100;

    document.getElementById("seconds").textContent = sec.toLocaleString();
    document.getElementById("percent").textContent = percent.toFixed(4) + "%";
    document.getElementById("bar").style.width = percent + "%";

    const remaining = END - now;
    if (remaining > 0) {
        document.getElementById("countdown").textContent = formatTime(remaining);
    } else {
        document.getElementById("countdown").textContent = "💥 LIMITE ATTEINTE";
    }

    // update graph every 2s only (anti lag)
    if (showChart && now - lastChartUpdate > 2000) {
        lastChartUpdate = now;
        data.labels.push("");
        data.datasets[0].data.push(percent);

        if (data.labels.length > 20) {
            data.labels.shift();
            data.datasets[0].data.shift();
        }

        chart.update();
    }
}

function toggleCountdown() {
    const el = document.getElementById("countdownBox");
    el.style.display = el.style.display === "none" ? "block" : "none";
}

function toggleChart() {
    const canvas = document.getElementById("chart");
    showChart = !showChart;

    if (showChart) {
        canvas.style.display = "block";
        if (!chart) initChart();
    } else {
        canvas.style.display = "none";
    }
}

setInterval(update, 1000);
update();
</script>

</body>
</html>
